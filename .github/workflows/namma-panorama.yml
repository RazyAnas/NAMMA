# Independent Street View panorama -> 3D pipeline.
# Triggered only by job manifests in panorama_v1/jobs/ or an explicit manual run.
# It never reads or writes v3/RUN.json, the video inbox, or the video workflow.
name: NAMMA Panorama to 3D

on:
  push:
    branches:
      - main
      - feature/streetview-panorama-3d
    paths:
      - "colab/real_scenes/panorama_v1/jobs/*.json"
      - "colab/real_scenes/panorama_v1/poll_inbox.py"
      - "colab/real_scenes/panorama_v1/gh_run.py"
  workflow_dispatch:
    inputs:
      job_file:
        description: "Repository path to an existing panorama job JSON"
        required: true
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: namma-panorama-queue
  cancel-in-progress: false

jobs:
  panorama:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN || secrets.HF_TOKEN_backup || secrets.HUGGINGFACE_WRITE_TOKEN_backup || secrets.HF_TOKEN_BACKUP || secrets.HUGGINGFACE_WRITE_TOKEN_BACKUP }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN || secrets.KAGGLE_API_TOKEN_backup || secrets.KAGGLE_TOKEN_backup || secrets.KAGGLE_API_TOKEN_BACKUP || secrets.KAGGLE_TOKEN_BACKUP }}
      PANORAMA_JOB_FILE: ${{ github.event.inputs.job_file }}
    steps:
      - name: Check out the panorama branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for the static tour exporter
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install orchestration and publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5" "huggingface_hub>=0.28" six numpy scipy plyfile trimesh

      - name: Poll private inbox for browser-submitted jobs
        if: github.event_name == 'schedule'
        run: python colab/real_scenes/panorama_v1/poll_inbox.py

      - name: Run an explicitly committed panorama job
        if: github.event_name != 'schedule'
        run: python colab/real_scenes/panorama_v1/gh_run.py
