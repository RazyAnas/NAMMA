name: Deploy NAMMA Street View Selector to Hugging Face

on:
  push:
    branches:
      - feature/streetview-selector
    paths:
      - "streetview-selector/site/**"
      - "streetview-selector/README.md"
      - ".github/workflows/streetview-selector-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namma-streetview-selector-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated selector branch
        uses: actions/checkout@v4
        with:
          ref: feature/streetview-selector
          sparse-checkout: |
            streetview-selector
      - name: Validate static application files
        run: |
          test -s streetview-selector/site/index.html
          test -s streetview-selector/site/app.js
          test -s streetview-selector/site/style.css
          node --check streetview-selector/site/app.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: pip install --disable-pip-version-check -q huggingface_hub
      - name: Deploy static files to the dedicated Hugging Face Space
        env:
          HF_TOKEN_PRIMARY: \${{ secrets.HF_TOKEN }}
          HF_TOKEN_SECONDARY: \${{ secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "anasrazy/namma-streetview-selector"
          candidates = [
              ("HF_TOKEN", os.environ.get("HF_TOKEN_PRIMARY")),
              ("HUGGINGFACE_WRITE_TOKEN", os.environ.get("HF_TOKEN_SECONDARY")),
          ]
          errors = []
          deployed = False

          for label, token in candidates:
              if not token:
                  continue
              try:
                  api = HfApi(token=token)
                  identity = api.whoami()
                  print("Trying Hugging Face credential:", label, "account:", identity.get("name", "unknown"))
                  api.upload_folder(
                      folder_path="streetview-selector/site",
                      path_in_repo=".",
                      repo_id=repo_id,
                      repo_type="space",
                      commit_message="Deploy NAMMA Street View Selector from GitHub Actions",
                  )
                  files = api.list_repo_files(repo_id=repo_id, repo_type="space")
                  required = {"index.html", "app.js", "style.css"}
                  missing = required.difference(files)
                  if missing:
                      raise RuntimeError("HF upload verification failed; missing: " + ", ".join(sorted(missing)))
                  print("HF Space files verified:", ", ".join(sorted(required)))
                  deployed = True
                  break
              except Exception as exc:
                  message = str(exc).replace(token, "[REDACTED]")[:500]
                  errors.append(label + ": " + type(exc).__name__ + ": " + message)
                  print(label, "could not deploy:", type(exc).__name__, message)

          if not deployed:
              if not any(token for _, token in candidates):
                  raise SystemExit("Neither HF_TOKEN nor HUGGINGFACE_WRITE_TOKEN is configured in GitHub Actions secrets.")
              raise SystemExit("No configured Hugging Face token could write to " + repo_id + ". " + " | ".join(errors))
          PY
      - name: Smoke-test hosted page
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://anasrazy-namma-streetview-selector.hf.space/"
          last_error = None
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "NAMMA-Space-Smoke-Test"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "NAMMA" in body and "Coverage Selector" in body:
                          print("Hosted Space returned HTTP 200 and the expected app title.")
                          raise SystemExit(0)
                      last_error = "Unexpected response: HTTP " + str(response.status)
              except Exception as exc:
                  last_error = str(exc)
              print("Attempt " + str(attempt + 1) + "/12: " + str(last_error))
              time.sleep(5)
          raise SystemExit("Hosted Space smoke test failed: " + str(last_error))
          PY
