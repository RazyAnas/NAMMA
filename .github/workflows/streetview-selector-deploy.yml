name: Deploy NAMMA Street View Selector to Hugging Face

on:
  push:
    branches:
      - feature/streetview-selector
    paths:
      - "streetview-selector/site/**"
      - "streetview-selector/README.md"
      - ".github/workflows/streetview-selector-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namma-streetview-selector-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated selector branch
        uses: actions/checkout@v4
        with:
          ref: feature/streetview-selector
          sparse-checkout: |
            streetview-selector
      - name: Validate static application files
        run: |
          test -s streetview-selector/site/index.html
          test -s streetview-selector/site/app.js
          test -s streetview-selector/site/style.css
          node --check streetview-selector/site/app.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: pip install --disable-pip-version-check -q huggingface_hub
      - name: Deploy selector into NAMMA's existing public static Space
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Missing HF_TOKEN or HUGGINGFACE_WRITE_TOKEN repository secret.")

          api = HfApi(token=token)
          repo_id = "anasrazy/namma-tour"
          destination = "streetview-selector"
          api.upload_folder(
              folder_path="streetview-selector/site",
              path_in_repo=destination,
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy NAMMA Street View Selector in isolated subfolder",
          )
          files = set(api.list_repo_files(repo_id=repo_id, repo_type="space"))
          required = {
              destination + "/index.html",
              destination + "/app.js",
              destination + "/style.css",
          }
          missing = required.difference(files)
          if missing:
              raise SystemExit("HF upload verification failed; missing: " + ", ".join(sorted(missing)))
          print("Verified selector files in existing NAMMA Space:", ", ".join(sorted(required)))
          print("Existing root viewer files were not modified.")
          PY
      - name: Smoke-test hosted selector
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://anasrazy-namma-tour.static.hf.space/streetview-selector/index.html"
          last_error = None
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "NAMMA-StreetView-Smoke-Test"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "NAMMA" in body and "Coverage Selector" in body:
                          print("Selector returned HTTP 200 and expected page title.")
                          raise SystemExit(0)
                      last_error = "Unexpected response: HTTP " + str(response.status)
              except Exception as exc:
                  last_error = str(exc)
              print("Attempt " + str(attempt + 1) + "/12: " + str(last_error))
              time.sleep(5)
          raise SystemExit("Hosted selector smoke test failed: " + str(last_error))
          PY
