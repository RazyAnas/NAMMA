name: Hotfix NAMMA panorama mobile viewer

on:
  push:
    branches:
      - feature/streetview-panorama-3d
    paths:
      - ".github/workflows/namma-tour-mobile-hotfix.yml"
      - "colab/real_scenes/final/make_tour.py"

permissions:
  contents: read

concurrency:
  group: namma-tour-mobile-hotfix
  cancel-in-progress: false

jobs:
  publish-mobile-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hugging Face client
        run: python -m pip install --upgrade "huggingface_hub>=0.28"
      - name: Patch and publish the existing panorama page
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN || secrets.HF_TOKEN_backup || secrets.HUGGINGFACE_WRITE_TOKEN_backup || secrets.HF_TOKEN_BACKUP || secrets.HUGGINGFACE_WRITE_TOKEN_BACKUP }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, hf_hub_download

          repo = "anasrazy/namma-tour"
          path = "panorama/ggps-ftp-20261103-retry-ssim-05/index.html"
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise RuntimeError("Missing Hugging Face write token secret.")

          local = hf_hub_download(repo_id=repo, repo_type="space", filename=path, token=token)
          with open(local, encoding="utf-8") as f:
              html = f.read()

          mobile_old = 'localStorage.setItem("performanceMode",m?"true":"false");if(m)localStorage.setItem("gamingControls","true");'
          mobile_new = 'localStorage.setItem("performanceMode",m?"true":"false");if(m){localStorage.setItem("gamingControls","true");if(!q.has("webgl"))q.set("webgl","1");}'
          loader_old = 'if((st&&st.loaded&&(q.get("showcollision")==="0"||st.hasCollisionOverlay))||s>120){d.classList.add("namma-ready","namma-show");clearInterval(k);}},200);})();</script>'
          loader_new = 'if((st&&st.loaded)||s>120){d.classList.add("namma-ready","namma-show");clearInterval(k);}},200);})();</script>'

          if mobile_old in html:
              html = html.replace(mobile_old, mobile_new, 1)
          elif mobile_new not in html:
              raise RuntimeError("Mobile renderer insertion point not found; refusing an unsafe page rewrite.")

          if loader_old in html:
              html = html.replace(loader_old, loader_new, 1)
          elif loader_new not in html:
              raise RuntimeError("Loader readiness insertion point not found; refusing an unsafe page rewrite.")

          if mobile_old in html or loader_old in html:
              raise RuntimeError("Patch verification failed.")

          api = HfApi(token=token)
          api.upload_file(
              path_or_fileobj=html.encode("utf-8"),
              path_in_repo=path,
              repo_id=repo,
              repo_type="space",
              commit_message="Fix mobile WebGL fallback and panorama loading overlay"
          )
          print("Published mobile renderer and loading-overlay fix to", repo, path)
          PY
