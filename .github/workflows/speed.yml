# Speed check and fast recipe (plan of 26 Nov: a room took 5.8 h; target 10-20 min of training on a T4). Only on the branch
# claude/fast-train: nothing here runs for main or the production branch.
# Start: change "n" in colab/real_scenes/v3/SPEED.json and push to claude/fast-train. The Kaggle job is v3/run.py with the
# settings of SPEED.json (kernel namma-speed); it is not started while another Kaggle job of the account runs ("only_if_idle").
# Results: speed_bench.json + speed_report.json in this run's log, files in hf://datasets/<user>/namma-v3-out/<run>/.
name: speed
on:
  push:
    branches: [claude/fast-train]
    paths: [colab/real_scenes/v3/SPEED.json]
concurrency:
  group: kaggle-gpu
  cancel-in-progress: false
env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
  RUN_JSON: colab/real_scenes/v3/SPEED.json
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            tests/v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle==2.2.5 six huggingface_hub pandas pillow numpy pytest
      - name: Tests of the fast recipe (with PyTorch, which the laptop does not have)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_fast.py -p no:cacheprovider
      - name: Kaggle job (push -> wait -> outputs)
        run: python colab/real_scenes/v3/gh_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-out
          path: |
            out/*.json
            out/*.log
            out/*/metrics.json
            out/*/qa_sheet.jpg
            out/*/qa_detail.jpg
            out/*/train.log
          if-no-files-found: ignore
