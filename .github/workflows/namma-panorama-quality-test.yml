name: NAMMA panorama quality benchmark

on:
  push:
    branches:
      - feature/streetview-panorama-3d
    paths:
      - ".github/workflows/namma-panorama-quality-test.yml"
      - "colab/real_scenes/panorama_v1/prepare_public_test.py"
      - "colab/real_scenes/panorama_v1/gh_run.py"
      - "colab/real_scenes/panorama_v1/run.py"
      - "colab/real_scenes/panorama_v1/sfm_hloc.py"
      - "colab/real_scenes/panorama_v1/make_tour.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namma-panorama-quality-test
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN || secrets.HF_TOKEN_backup || secrets.HUGGINGFACE_WRITE_TOKEN_backup || secrets.HF_TOKEN_BACKUP || secrets.HUGGINGFACE_WRITE_TOKEN_BACKUP }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN || secrets.KAGGLE_API_TOKEN_backup || secrets.KAGGLE_TOKEN_backup || secrets.KAGGLE_API_TOKEN_BACKUP || secrets.KAGGLE_TOKEN_BACKUP }}
    steps:
      - name: Check out the isolated panorama branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for the static NAMMA viewer exporter
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install panorama orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5" "huggingface_hub>=0.28" six pillow numpy scipy plyfile trimesh

      - name: Verify cloud credentials are available
        run: |
          test -n "$HF_TOKEN" || { echo "Missing HF_TOKEN / HUGGINGFACE_WRITE_TOKEN secret (including *_backup variants)."; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing KAGGLE_API_TOKEN / KAGGLE_TOKEN secret (including *_backup variants)."; exit 1; }
          echo "Both cloud credentials are present; their values are not printed."

      - name: Reuse the staged 40-panorama GGPS FTP benchmark
        run: |
          echo "Using the already uploaded 40-panorama bundle from the successful staging step."

      - name: Run full-resolution NAMMA panorama reconstruction on Kaggle GPU
        env:
          PANORAMA_JOB_FILE: colab/real_scenes/panorama_v1/jobs/ggps-ftp-20261102-161501.json
        run: python colab/real_scenes/panorama_v1/gh_run.py

      - name: Preserve job diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namma-panorama-quality-test
          path: |
            out/panorama_summary.json
            out/sfm_report.json
            out/full/metrics.json
            out/full/train.log
            out/failure.json
          if-no-files-found: ignore
          retention-days: 14
