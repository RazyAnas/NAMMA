<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NAMMA Street World</title>
<style>
  :root { --fg: #f2f2f2; --muted: #b9b9b9; --panel: rgba(12, 14, 18, 0.62); --accent: #7cc4ff; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: var(--fg); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 8px 12px; background: var(--panel); border-radius: 8px; pointer-events: none; min-width: 180px; }
  #hud b { color: var(--accent); }
  #help { position: fixed; bottom: 12px; left: 12px; padding: 8px 12px; background: var(--panel); border-radius: 8px; color: var(--muted); max-width: min(560px, calc(100vw - 48px)); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 8, 0.72); cursor: pointer; text-align: center; padding: 16px; }
  #start h1 { font-size: 22px; margin: 0 0 8px; }
  #start p { color: var(--muted); margin: 4px 0; }
  #bar { width: min(320px, 70vw); height: 6px; background: #222; border-radius: 3px; margin: 14px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #touch { position: fixed; right: 16px; bottom: 16px; display: none; gap: 8px; }
  #touch button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--panel); color: var(--fg); font-size: 15px; }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="help"><b>WASD</b> move · <b>mouse</b> look · <b>Shift</b> run · <b>Space</b> jump · <b>C</b> car on/off · <b>V</b> 1st/3rd person · <b>B</b> benchmark</div>
<div id="start"><div><h1>NAMMA Street World</h1><p id="status">Loading the street…</p><div id="bar"><i></i></div><p>Click to start walking</p></div></div>
<div id="touch"><button id="tFwd">▲</button><button id="tCar">car</button></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
