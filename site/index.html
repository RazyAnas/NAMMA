<!doctype html>

<!-- Hugging Face puts one small script with the Space's sign-in settings at the very top of the head, above this line. The
     policy below applies to everything after it: only this site's own files run, and the page may talk only to Hugging Face
     and Kaggle. Keep this meta tag first, and keep every script of the site in its own file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.hf.space https://*.amazonaws.com https://www.kaggle.com https://api.kaggle.com https://storage.googleapis.com; frame-src https://*.hf.space; script-src 'self'">

<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="NAMMA turns a phone video of a room into a 3D tour you can walk through in the browser. Free: trained on your own Kaggle GPU, stored in your own Hugging Face account.">

<link rel="stylesheet" href="css/site.css">
<script type="module" src="js/app.js"></script>
